<!doctype html>
<!-- Side panel page. The toolbar popup is popup.html, the same page with a
     fixed width: a popup sizes itself to its content. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cue</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <h1>Cue</h1>
      <div class="header-actions">
        <button id="pause-all" type="button" hidden>Pause all</button>
        <button id="open-settings" type="button" class="icon-btn" title="Settings" aria-label="Settings"></button>
      </div>
    </header>
    <ul id="list" aria-label="Media in your tabs"></ul>
    <p id="empty" class="empty">
      Nothing playing
      <span>Play audio or video in any tab and it shows up here.</span>
    </p>
    <script src="panel.js"></script>
  </body>
</html>
